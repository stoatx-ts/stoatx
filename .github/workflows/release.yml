name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_STOATX_RELEASE_APP_ID }}
          private-key: ${{ secrets.STOATX_RELEASE_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Extract PR Branch Name
        id: extract-branch
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        run: |
          # Parse the branch name from the JSON array output
          BRANCH_NAME=$(echo '${{ steps.rp.outputs.prs }}' | jq -r '.[0].headBranchName')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Checkout PR Branch
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.extract-branch.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm (PR Docs)
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.0

      - name: Setup Node.js (PR Docs)
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (PR Docs)
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Generate Versioned Docs and Commit
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        run: |
          # Read the bumped version that release-please just put in package.json
          VERSION=$(node -p "require('./packages/client/package.json').version")

          echo "Snapshotting docs for version: $VERSION"
          pnpm --filter @stoatx/docs exec docusaurus docs:version:api $VERSION

          # Configure Git
          git config user.name "stoatx-release[bot]"
          git config user.email "stoatx-release[bot]@users.noreply.github.com"

          git add apps/docs/api_versioned_docs apps/docs/api_versions.json

          # Only commit and push if there are actual changes (prevents workflow failures on subsequent runs)
          if ! git diff --staged --quiet; then
            git commit -m "docs: snapshot api version v$VERSION [skip ci]"
            git push origin HEAD
          else
            echo "Docs are already up to date for this PR."
          fi

      - name: Checkout Repo (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.0

      - name: Setup Node.js (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build packages (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: pnpm run build

      - name: Publish to npm
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish -r --access public --no-git-checks

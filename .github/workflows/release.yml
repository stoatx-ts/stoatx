name: Release Please
on:
  push:
    # main releases minor and major versions; release/<package>/vX.Y branches release patches of one package.
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_STOATX_RELEASE_APP_ID }}
          private-key: ${{ secrets.STOATX_RELEASE_APP_PRIVATE_KEY }}

      # A patch from an older line shouldn't take GitHub's "Latest" badge. Remember who has it.
      - name: Remember the latest GitHub release
        id: latest-release
        if: ${{ startsWith(github.ref_name, 'release/') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Each branch gets its own release PR. Release branches narrow their config to one
          # package with "versioning": "always-bump-patch" (see release-branch.yml).
          target-branch: ${{ github.ref_name }}

      - name: Give the "Latest" badge back
        if: ${{ startsWith(github.ref_name, 'release/') && steps.rp.outputs.releases_created == 'true' && steps.latest-release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.latest-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest

      # The docs site is built from main, so only main's release PRs snapshot the API docs.
      - name: Extract PR Branch Name
        id: extract-branch
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        run: |
          # Parse the branch name from the JSON array output
          BRANCH_NAME=$(echo '${{ steps.rp.outputs.prs }}' | jq -r '.[0].headBranchName')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Checkout PR Branch
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.extract-branch.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm (PR Docs)
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.0

      - name: Setup Node.js (PR Docs)
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (PR Docs)
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        run: pnpm install --frozen-lockfile

      - name: Build API Docs
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        run: |
          # docusaurus-plugin-typedoc regenerates the API markdown as part of
          # the Docusaurus build lifecycle, so running the real build here
          # ensures the API docs (docs/client and docs/voice*) are current even if they weren't rebuilt locally
          # before this PR was opened.
          pnpm --filter @stoatx/docs run build

      - name: Generate Versioned Docs and Commit
        if: ${{ steps.rp.outputs.prs_created == 'true' && github.ref_name == 'main' }}
        run: |
          # Read the bumped version that release-please just put in package.json
          VERSION=$(node -p "require('./packages/client/package.json').version")

          # Grab the branch name we extracted earlier
          BRANCH_NAME="${{ steps.extract-branch.outputs.branch }}"

          echo "Snapshotting docs for version: $VERSION"
          pnpm --filter @stoatx/docs exec docusaurus docs:version:api $VERSION

          # Configure Git
          git config user.name "stoatx-release[bot]"
          git config user.email "stoatx-release[bot]@users.noreply.github.com"

          git add apps/docs/api_versioned_docs apps/docs/api_versioned_sidebars apps/docs/api_versions.json apps/docs/docs

          # Only commit and push if there are actual changes (prevents workflow failures on subsequent runs)
          if ! git diff --staged --quiet; then
            git commit -m "docs: snapshot api version v$VERSION"

            # Fetch, rebase, and explicitly push to the PR branch
            git fetch origin "$BRANCH_NAME"
            git pull --rebase --autostash origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
            else
              echo "Docs are already up to date for this PR."
            fi

      - name: Checkout Repo (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.0

      - name: Setup Node.js (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build packages (Publish)
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: pnpm run build

      - name: Publish to npm
        if: ${{ steps.rp.outputs.releases_created == 'true' && github.ref_name == 'main' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish -r --access public --no-git-checks

      # Publishing moves npm's "latest" tag to whatever was published, which would make
      # `npm install` pick a 1.0.x patch over 1.1.0. A release branch publishes only its package,
      # under its own tag (release/client/v1.0 -> "release-v1.0"), and only takes "latest"
      # when the patch is the package's highest version.
      - name: Publish to npm (release branch)
        if: ${{ steps.rp.outputs.releases_created == 'true' && startsWith(github.ref_name, 'release/') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          LINE="${GITHUB_REF_NAME#release/}"  # e.g. client/v1.0
          MANIFEST="packages/${LINE%%/*}/package.json"
          DIST_TAG="release-${LINE#*/}"         # e.g. release-v1.0

          NAME=$(node -p "require('./$MANIFEST').name")
          VERSION=$(node -p "require('./$MANIFEST').version")
          pnpm --filter "$NAME" publish --access public --no-git-checks --tag "$DIST_TAG"

          LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo "0.0.0")
          HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)
          if [ "$VERSION" != "$LATEST" ] && [ "$HIGHEST" = "$VERSION" ]; then
            echo "$NAME@$VERSION is the highest version, tagging it latest"
            npm dist-tag add "$NAME@$VERSION" latest
          fi

name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_STOATX_RELEASE_APP_ID }}
          private-key: ${{ secrets.STOATX_RELEASE_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Repo
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.0

      - name: Setup Node.js
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: pnpm run build

      - name: Publish to npm
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish -r --access public --no-git-checks

      - name: Generate Versioned Docs
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: |
          # Read the newly bumped version directly from the client package
          # (Adjust 'packages/client/package.json' to wherever your primary version lives)
          VERSION=$(node -p "require('./packages/client/package.json').version")

          echo "Snapshotting docs for version: $VERSION"

          pnpm --filter @stoatx/docs exec docusaurus docs:version:api $VERSION

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Commit and Push Docs
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: |
          # Configure Git as your GitHub App bot
          git config user.name "stoatx-release[bot]"
          git config user.email "stoatx-release[bot]@users.noreply.github.com"

          # Stage the newly created version snapshot folder and the registry JSON
          git add apps/docs/api_versioned_docs apps/docs/api_versions.json

          # Commit the changes (using [skip ci] so it doesn't accidentally trigger another workflow loop)
          git commit -m "docs: snapshot api version v${{ env.VERSION }} [skip ci]"

          # Push directly to main
          git push origin main
